name: Deploy to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (leave blank for latest)'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download release site
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            gh release download --pattern 'site.tar.gz' -- "$RELEASE_TAG"
          else
            gh release download --pattern 'site.tar.gz'
          fi
          mkdir dist
          tar -xzf site.tar.gz -C dist
          test -f dist/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
