name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Base artwork Release tag (blank uses v0.2.0-pages.1)'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate current source
        run: npm test
      - name: Download existing artwork
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || 'v0.2.0-pages.1' }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/yanyu-artwork"
          gh release download --pattern 'site.tar.gz' --dir "$RUNNER_TEMP/yanyu-artwork" -- "$RELEASE_TAG"
          tar -xzf "$RUNNER_TEMP/yanyu-artwork/site.tar.gz" -C "$RUNNER_TEMP/yanyu-artwork"
          test -d "$RUNNER_TEMP/yanyu-artwork/assets"
          cp -a "$RUNNER_TEMP/yanyu-artwork/assets" dist/assets
          test -f dist/index.html
      - name: Stamp source revision
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: node -e "require('fs').writeFileSync('dist/version.json', JSON.stringify({version:require('./package.json').version,commit:process.env.SOURCE_REVISION,builtAt:new Date().toISOString()})+'\n')"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
