name: Combat regression

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  combat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run original-code combat and input checks
        run: npm test
